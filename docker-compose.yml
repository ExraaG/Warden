services:
  warden:
    image: warden:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TZ=${TZ:-Europe/Vienna}
      - CRAFTY_URL=${CRAFTY_URL:-https://host.docker.internal:8443}
      - CRAFTY_API_KEY=${CRAFTY_API_KEY:-}
      - WARDEN_API_KEY=${WARDEN_API_KEY:-warden_secret_key_change_me}
      - DATA_DIR=/data
      - DEV_FIXTURE_MODE=${DEV_FIXTURE_MODE:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
