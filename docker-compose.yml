services:
  warden:
    image: warden:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-22313}:22313"
      - "25565:25565"
    environment:
      - PORT=22313
      - TZ=${TZ:-Europe/Vienna}
      - WARDEN_API_KEY=${WARDEN_API_KEY:-warden_secret_key_change_me}
      - DATA_DIR=/data
      - DEV_FIXTURE_MODE=${DEV_FIXTURE_MODE:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22313/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
